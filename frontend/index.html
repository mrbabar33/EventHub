<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EventHub - Find & book your next event</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/event-card.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <header id="navbar"></header>

  <section class="hero">
    <div class="container">
      <h1>Find &amp; book your next event</h1>
      <form id="searchForm" class="search-box">
        <input type="text" id="searchInput" placeholder="Search concerts, seminars, workshops...">
        <button type="submit" class="btn btn-accent">Search</button>
      </form>
    </div>
  </section>

  <main class="container section">
    <div class="section-head">
      <h2>Upcoming Events</h2>
      <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="concert">Concerts</button>
        <button class="filter-btn" data-category="seminar">Seminars</button>
        <button class="filter-btn" data-category="university">University</button>
      </div>
    </div>
    <div id="eventsGrid" class="events-grid"></div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
