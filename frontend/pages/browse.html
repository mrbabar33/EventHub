<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Events - EventHub</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/event-card.css">
  <link rel="stylesheet" href="../css/browse.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container section">
    <h2 class="page-title">Browse Events</h2>
    <div class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="concert">🎵 Concerts</button>
      <button class="filter-btn" data-category="seminar">📚 Seminars</button>
      <button class="filter-btn" data-category="university">🎓 University</button>
    </div>
    <div id="eventsGrid" class="events-grid"></div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/browse.js"></script>
</body>
</html>
